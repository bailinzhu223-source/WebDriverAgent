name: Build WDA 4.8.5 iOS14 (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    # macos-12 is no longer available on current GitHub-hosted runners.
    # WDA 4.8.5 is Objective-C-only, so the current Xcode 15 image can
    # produce a device build with an iOS 14 deployment target.
    runs-on: macos-14
    steps:
      - name: Checkout WDA v4.8.5 source
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v4.8.5
          path: WebDriverAgent

      - name: Select Xcode 15.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Bootstrap dependencies
        working-directory: WebDriverAgent
        run: ./Scripts/bootstrap.sh -d

      - name: Build unsigned device runner
        working-directory: WebDriverAgent
        run: >-
          xcodebuild -project WebDriverAgent.xcodeproj
          -scheme WebDriverAgentRunner
          -configuration Debug
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Package unsigned IPA
        working-directory: WebDriverAgent
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app ipa/Payload/
          cd ipa
          zip -qry ../WebDriverAgentRunner-v4.8.5-ios14-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-v4.8.5-ios14-unsigned
          path: WebDriverAgent/WebDriverAgentRunner-v4.8.5-ios14-unsigned.ipa
