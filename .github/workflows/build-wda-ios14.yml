name: Build WDA 4.8.5 iOS14 (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    # Xcode 12.5.1 is the compatible toolchain for iOS 14/WDA 4.8.5.
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4.8.5

      - name: Select Xcode 12.5.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '12.5.1'

      - name: Bootstrap dependencies
        run: ./Scripts/bootstrap.sh -d

      - name: Build unsigned device runner
        run: >-
          xcodebuild -project WebDriverAgent.xcodeproj
          -scheme WebDriverAgentRunner
          -configuration Debug
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Package unsigned IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app ipa/Payload/
          cd ipa
          zip -qry ../WebDriverAgentRunner-v4.8.5-ios14-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-v4.8.5-ios14-unsigned
          path: WebDriverAgentRunner-v4.8.5-ios14-unsigned.ipa
